<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocFlow</title>
    <meta name="description" content="Secure document exchange between an accountant and their clients." />
    <!-- A private portal: nothing here should be indexed or previewed. -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      IBM Plex is served from /fonts (see src/index.css). Nothing is fetched from
      a third party: the firm's PC may sit behind a restrictive network, and a
      client's browser must not have to tell Google which portal it is loading.
      The two faces below carry almost every pixel of text, so they are preloaded.
    -->
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
